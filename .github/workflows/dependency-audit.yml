name: Dependency Audit

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build audit candidate
        run: |
          pip install build 'pip-audit==2.10.1'
          python -m build
          python -m venv --without-pip "$RUNNER_TEMP/runtime"
          python -m venv --without-pip "$RUNNER_TEMP/development"
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip --python "$RUNNER_TEMP/runtime/bin/python" install "${wheels[0]}"
          python -m pip --python "$RUNNER_TEMP/development/bin/python" install "${wheels[0]}[dev,docs]"
      - name: Report runtime and development findings
        if: always()
        run: |
          set +e
          for closure in runtime development; do
            site_packages=$("$RUNNER_TEMP/$closure/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
            flag=()
            if [ "$closure" = development ]; then flag=(--development); fi
            candidate_version=$(python -c 'import zipfile,email; from pathlib import Path; z=zipfile.ZipFile(next(Path("dist").glob("*.whl"))); m=[n for n in z.namelist() if n.endswith(".dist-info/METADATA")]; assert len(m)==1; print(email.message_from_bytes(z.read(m[0]))["Version"])')
            make security-audit-report SECURITY_RUN=python AUDIT_SITE_PACKAGES="$site_packages" CANDIDATE_VERSION="$candidate_version" AUDIT_FLAGS="${flag[*]}" SECURITY_OUTPUT="security-results/$closure"
            status=$?
            echo "Reporting-only $closure audit exit code: $status" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0
      - name: Upload redacted audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-evidence
          path: security-results/**
          if-no-files-found: error
