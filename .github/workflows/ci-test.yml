name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Checkout trusted classifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.pull_request.base.sha) || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail_safe() {
            printf 'docs_only=false\ndocs_changed=true\nfull_required=true\n' >> "$GITHUB_OUTPUT"
          }
          fail_safe
          paths="${RUNNER_TEMP}/changed-paths.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
              git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/pr-merge" || exit 0
              HEAD_SHA=$(git rev-parse refs/remotes/origin/pr-merge^2) || exit 0
            fi
          fi
          tools/ci_changed_paths.sh \
            "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" "$BEFORE_SHA" "$SHA" > "$paths" || exit 0
          tools/ci_classify_changes.sh < "$paths" >> "$GITHUB_OUTPUT" || exit 0

  # Lint, type-check and workflow hygiene run once on a single pinned
  # interpreter (Python 3.11). These checks are interpreter-agnostic, so
  # fanning them across the matrix would only duplicate work.
  quality:
    name: Lint, type-check & workflow hygiene (Py 3.11)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-file format check below diffs against the PR merge-base,
          # which a shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Workflow pin-hygiene lint
        run: python tools/lint_workflow_pins.py

      - name: Hatch/matrix hygiene lint
        run: python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: |
          ruff check src tests tools docs_hooks
          ruff format --check src tests tools docs_hooks

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy)
        run: mypy src tests

  test:
    name: Test (Py ${{ matrix.python-version }}, ${{ matrix.resolution }} deps)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the Python versions advertised in pyproject classifiers.
        # azure-functions 1.25.0 declares Requires-Python >=3.10 with no upper
        # cap, so the 1.x pin resolves on 3.13/3.14 and needs no separate 2.x
        # lane here.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }} (${{ matrix.resolution }} deps)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert the runtime interpreter matches the matrix cell
        # Belt-and-braces: tests below run directly on this interpreter (raw
         # pytest, NOT the pinned Hatch env), so every matrix cell
        # is genuinely exercised. This guard fails loudly if that ever drifts.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # Python-3.10-pinned hatch env). The repo pytest config enables --cov
        # with fail_under=95 and deselects e2e; tests/e2e is ignored here
        # because it is a separate real-Azure lane.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.11' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest --ignore=tests/e2e
          else
            pytest --ignore=tests/e2e --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.11'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.resolution == 'latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-min.txt

      - name: Install exact declared floors and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.2.2.post1 pytest pytest-cov requests types-requests
          python -m pip install -c constraints-min.txt ".[dev]"

      - name: Assert resolved dependency floors
        run: |
          python - <<'PY'
          from importlib.metadata import version

          expected = {
              "Jinja2": "3.1.0",
              "typer": "0.16.0",
              "azure-functions": "1.23.0",
              "azure-functions-logging": "0.14.0",
              "azure-functions-openapi": "0.29.0",
              "azure-functions-validation": "0.14.0",
              "azure-functions-doctor": "0.22.0",
              "pydantic": "2.0",
          }
          resolved = {name: version(name) for name in expected}
          print(f"resolved dependencies={resolved}")
          assert resolved == expected
          PY
          python -m pip check

      - name: Run suite against minimum dependencies
        run: |
          deselect=()
          while IFS= read -r entry; do
            case "$entry" in
              ""|\#*) continue ;;
              *) deselect+=("--deselect=$entry") ;;
            esac
          done < tools/minimum_dependency_optional_tests.txt
          pytest --ignore=tests/e2e --no-cov "${deselect[@]}"

  artifact-build:
    name: Build compatibility artifacts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build==1.2.2.post1
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and CLI smoke (Py 3.11)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install candidate wheel
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel and generate an HTTP project outside checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path

          import azure_functions_scaffold

          module_path = Path(azure_functions_scaffold.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)
          PY
          azure-functions-scaffold new artifact-http --no-git --no-github-actions
          test -f /tmp/artifact-http/function_app.py

  generated-host-smoke:
    name: Generated HTTP app host smoke (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Core Tools, Azurite, and scaffold
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate and install the HTTP project
        run: |
          cd "${RUNNER_TEMP}"
          azure-functions-scaffold new host-smoke \
            --python-version "${{ matrix.python-version }}" \
            --no-git \
            --no-github-actions
          cd host-smoke
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .

      - name: Start host and probe health route
        working-directory: ${{ runner.temp }}/host-smoke
        env:
          AzureWebJobsStorage: UseDevelopmentStorage=true
          FUNCTIONS_WORKER_RUNTIME: python
        run: |
          source .venv/bin/activate
          azurite --silent --location "${RUNNER_TEMP}/azurite" > "${RUNNER_TEMP}/azurite.log" 2>&1 &
          func start --verbose > "${RUNNER_TEMP}/func-host.log" 2>&1 &
          host_pid=$!
          trap 'cat "${RUNNER_TEMP}/func-host.log"; kill "${host_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output "${RUNNER_TEMP}/health.out" --write-out '%{http_code}' http://127.0.0.1:7071/api/health || true)
            if [ "${status}" = 200 ]; then
              cat "${RUNNER_TEMP}/health.out"
              exit 0
            fi
            sleep 2
          done
          exit 1

  docs-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with docs and test dependencies
        run: python -m pip install -e ".[docs]" pytest pytest-cov

      - name: Build docs strictly
        run: mkdocs build --strict

      - name: Run docs-dependent tests
        run: |
          pytest --no-cov \
            tests/test_docs_cli_examples.py \
            tests/test_readme_layout.py \
            tests/test_readme_triggers.py

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  ci-required:
    needs:
      - changes
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - generated-host-smoke
      - docs-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.pull_request.base.sha) || github.sha }}

      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_REQUIRED: ${{ needs.changes.outputs.full_required }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
        run: |
          printf '%s' "$RESULTS" | python3 tools/ci_required_gate.py "$FULL_REQUIRED" "$DOCS_CHANGED"
