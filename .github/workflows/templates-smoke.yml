name: Generated Project Smoke Tests

# A thin caller of tests/test_generated_projects.py, the lane the required `test`
# job also runs. Each matrix cell only selects one node id; the lane scaffolds the
# project, installs it into its own venv, runs its `make check-all`, requires at
# least one executed and no skipped test, and applies Doctor's required profile.
# A cell that selects, collects or executes nothing fails, and no step tolerates
# a non-zero pytest exit status (tests/test_workflow_pin_hygiene.py guards this).

on:
  pull_request:
    paths:
      - "src/azure_functions_scaffold/templates/**"
      - "src/azure_functions_scaffold/template_registry.py"
      - "src/azure_functions_scaffold/scaffolder.py"
      - "src/azure_functions_scaffold/generator/**"
      - "tests/test_generated_projects.py"
      - "pyproject.toml"
      - "*.lock"
      - ".github/workflows/templates-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "src/azure_functions_scaffold/templates/**"
      - "src/azure_functions_scaffold/template_registry.py"
      - "src/azure_functions_scaffold/scaffolder.py"
      - "src/azure_functions_scaffold/generator/**"
      - "tests/test_generated_projects.py"
      - "pyproject.toml"
      - "*.lock"
      - ".github/workflows/templates-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Full template registry coverage is currently 10 entries, so we keep
        # every template in the matrix.
        template:
          - http
          - timer
          - queue
          - blob
          - servicebus
          - eventhub
          - cosmosdb
          - durable
          - ai
          - langgraph
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scaffold CLI
        run: python -m pip install -e ".[dev]"

      - name: Run the generated-project lane for the template
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          pytest "tests/test_generated_projects.py::test_generated_project_passes_in_isolated_venv[${TEMPLATE}]" \
            --no-cov --junitxml=junit.xml

      - name: Append counts to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          suite = ET.parse("junit.xml").getroot().find("testsuite")
          counts = {k: int(suite.get(k, "0")) for k in ("tests", "failures", "errors", "skipped")}
          print(" ".join(f"{k}={v}" for k, v in counts.items()))
          assert counts["tests"] >= 1 and counts["skipped"] == 0, counts
          PY

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.template }}-py${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  scaffold-with-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The `--with-*` combinations of the http template; ids of
        # test_generated_http_features_pass_in_isolated_venv.
        features:
          - openapi
          - validation
          - doctor
          - openapi-validation
          - openapi-validation-doctor

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scaffold CLI
        run: python -m pip install -e ".[dev]"

      - name: Run the generated-project lane for the feature combination
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          pytest "tests/test_generated_projects.py::test_generated_http_features_pass_in_isolated_venv[${FEATURES}]" \
            --no-cov --junitxml=junit.xml

      - name: Append counts to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          suite = ET.parse("junit.xml").getroot().find("testsuite")
          counts = {k: int(suite.get(k, "0")) for k in ("tests", "failures", "errors", "skipped")}
          print(" ".join(f"{k}={v}" for k, v in counts.items()))
          assert counts["tests"] >= 1 and counts["skipped"] == 0, counts
          PY

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-features-${{ matrix.features }}
          path: junit.xml
          retention-days: 7

  add-commands-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scaffold CLI
        run: python -m pip install -e ".[dev]"

      - name: Run the generated-project lane after the add commands
        run: |
          pytest "tests/test_generated_projects.py::test_generated_http_project_passes_after_add_commands" \
            --no-cov --junitxml=junit.xml

      - name: Append counts to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          suite = ET.parse("junit.xml").getroot().find("testsuite")
          counts = {k: int(suite.get(k, "0")) for k in ("tests", "failures", "errors", "skipped")}
          print(" ".join(f"{k}={v}" for k, v in counts.items()))
          assert counts["tests"] >= 1 and counts["skipped"] == 0, counts
          PY

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-add-commands
          path: junit.xml
          retention-days: 7
