name: Generated Project Smoke Tests

on:
  pull_request:
    paths:
      - "src/azure_functions_scaffold/templates/**"
      - "src/azure_functions_scaffold/template_registry.py"
      - "src/azure_functions_scaffold/scaffolder.py"
      - "src/azure_functions_scaffold/generator/**"
      - "pyproject.toml"
      - "*.lock"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/templates-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/azure_functions_scaffold/templates/**"
      - "src/azure_functions_scaffold/template_registry.py"
      - "src/azure_functions_scaffold/scaffolder.py"
      - "src/azure_functions_scaffold/generator/**"
      - "pyproject.toml"
      - "*.lock"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/templates-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [http, timer, queue, blob, servicebus, eventhub, cosmosdb, durable, ai, langgraph]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install selected-interpreter tooling
        run: make install-ci
      - name: Compile, lint, typecheck, execute tests and classify diagnostics from installed-wheel CLI
        env:
          TEMPLATE: ${{ matrix.template }}
        run: python -m tools.verification generated-project "$TEMPLATE"
      - name: Upload generated template evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-${{ matrix.template }}-py${{ matrix.python-version }}
          path: test-results/**

  scaffold-with-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - --with-openapi
          - --with-validation
          - --with-doctor
          - --with-openapi --with-validation
          - --with-openapi --with-validation --with-doctor
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install selected-interpreter tooling
        run: make install-ci
      - name: Validate isolated HTTP feature combination including strict pytest and Doctor JSON
        env:
          VERIFICATION_FEATURE_FLAGS: ${{ matrix.flags }}
        run: python -m tools.verification generated-project http
      - name: Upload feature evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: features-${{ strategy.job-index }}
          path: test-results/**

  add-commands-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install selected-interpreter tooling
        run: make install-ci
      - name: Validate installed CLI add, add-route, add-resource and Service Bus expansion
        env:
          VERIFICATION_ADDITIONS: "1"
          VERIFICATION_FEATURE_FLAGS: --with-openapi --with-validation --with-doctor
        run: python -m tools.verification generated-project http
      - name: Upload expansion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: add-commands-evidence
          path: test-results/**

  python-314:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [http, durable]
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install selected-interpreter tooling
        run: make install-ci
      - name: Validate isolated Python 3.14 generated project including strict pytest
        env:
          TEMPLATE: ${{ matrix.template }}
        run: python -m tools.verification generated-project "$TEMPLATE"
      - name: Upload Python 3.14 template evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-314-${{ matrix.template }}
          path: test-results/**
